<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okky Christian - Class 5</title>
  <link rel="stylesheet" href="style_okky.css">
  <style>
    
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .master-nav-frame {
      width: 100%;
      height: 65px;
      border: none;
      display: block;
    }
    .master-content-frame {
      width: 100%;
      height: calc(100vh - 65px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  
  <iframe src="nav_okky.html" name="navFrame" class="master-nav-frame" title="Navigation Header"></iframe>

  
  <iframe src="home_okky.html" name="contentFrame" class="master-content-frame" id="contentFrame"></iframe>
 
</body>
</html>
