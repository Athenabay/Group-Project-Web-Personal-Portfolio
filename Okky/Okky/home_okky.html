<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Okky Christian</title>
  <link rel="stylesheet" href="style_okky.css">
  <style>
    body {
      margin: 0;
      background-color: #0d0f12;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      /* Memberikan jarak bawah agar konten hero tidak tertutup fixed footer */
      padding-bottom: 55px;
      box-sizing: border-box;
    }
    .hero-section {
      min-height: calc(100vh - 55px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      box-sizing: border-box;
      background-image: linear-gradient(rgba(13, 15, 18, 0.75), rgba(13, 15, 18, 0.75)), url('assetky/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .hero-content {
      max-width: 600px;
    }
    .tagline {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 1.25rem;
    }
    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin: 0 0 1.25rem 0;
      color: #ffffff;
      letter-spacing: -1px;
    }
    .hero-sub {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
    }
    .btn-primary {
      background-color: #38bdf8;
      color: #0d0f12;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-secondary {
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #1e293b;
    }
    .hero-graphic {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .graphic-card {
      width: 100%;
      height: 100%;
      background: rgba(22, 27, 36, 0.75); 
      backdrop-filter: blur(8px); 
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .avatar-circle {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      background: linear-gradient(45deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1.5rem;
      border: 4px solid #161b24;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    /* Fixed Bottom Footer - Posisi di Kiri */
    .fixed-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 2rem;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .footer-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 30px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
    }

    .footer-back-btn:hover {
      background: #38bdf8;
      color: #0d1117;
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .footer-back-btn svg {
      transition: transform 0.25s ease;
    }

    .footer-back-btn:hover svg {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <!-- Left Hero Content -->
    <div class="hero-content">
      <span class="tagline">Information Technology</span>
      <h1 class="hero-title">Personal Portfolio</h1>
      <p class="hero-sub">Discipline, Hard-Working, Learner</p>
      <div class="btn-group">
        <a href="portfolio_okky.html" class="btn-primary">Explore Portfolio</a>
        <a href="contact_okky.html" class="btn-secondary">Contact Us</a>
      </div>
    </div>

    <!-- Right Hero Visual Card -->
    <div class="hero-graphic">
      <div class="graphic-card">
        <div class="avatar-circle" style="
          background-image: url('assetky/Photo 2.jpeg'); 
          background-size: cover; 
          background-position: center;">
        </div>
        <h3 style="margin: 0; font-size: 1.5rem; color: #fff;">Okky Christian</h3>
        <p style="color: #38bdf8; margin: 4px 0 16px 0; font-size: 0.9rem; font-weight: 600;">Freshman of President University</p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
          <span style="background: #1e293b; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; color: #cbd5e1;">Web Programming</span>
          <span style="background: #1e293b; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; color: #cbd5e1;">Computer Networking</span>
          <span style="background: #1e293b; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; color: #cbd5e1;">Climber</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Fixed Bottom Footer dengan Tombol di Kiri -->
  <footer class="fixed-footer">
    <a href="../../main.html" class="footer-back-btn" target="_top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to group web</span>
    </a>
  </footer>
</body>
</html>
