<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0f12;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 65px;
      border-bottom: 1px solid #1f2937;
      background: rgba(13, 15, 18, 0.95);
      box-sizing: border-box;
    }
    .logo {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span {
      color: #38bdf8;
    }
    .nav-links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 1.75rem;
    }
    .nav-links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.1);
    }
    .contact-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      transition: background 0.3s;
    }
    .contact-badge:hover {
      background: #38bdf8;
      color: #0d0f12;
    }
  </style>
</head>
<body>
  <nav class="nav-container">
    <a href="home_okky.html" target="contentFrame" class="logo">
      <div style="width: 28px; height: 28px; background: #38bdf8; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #0d0f12; font-weight: 900; font-size: 14px;">🧗🏻</div>
      OKKY <span>CHRISTIAN</span>
    </a>

    
    <ul class="nav-links">
      <li><a href="home_okky.html" target="contentFrame" id="link-home" class="nav-link">Home</a></li>
      <li><a href="about_okky.html" target="contentFrame" id="link-about" class="nav-link">About</a></li>
      <li><a href="resume_okky.html" target="contentFrame" id="link-resume" class="nav-link">Resume</a></li>
      <li><a href="portfolio_okky.html" target="contentFrame" id="link-portfolio" class="nav-link">Portfolio</a></li>
      <li><a href="contact_okky.html" target="contentFrame" id="link-contact" class="nav-link">Contact</a></li>
    </ul>

    <a href="contact_okky.html" target="contentFrame" class="contact-badge">
      📞 0812-6888-6210
    </a>
  </nav>
</body>
</html>
